global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
