groups:
  - name: night-shift-demo
    rules:
      - alert: DBConnectionsExhausted
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5s
        labels: {severity: critical, service: api}
        annotations:
          summary: "Postgres is above 80% of max_connections; the orders API is failing requests."

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 5s
        labels: {severity: critical, service: api}
        annotations:
          summary: "The orders API is not responding to scrapes."

      - alert: ApiErrorRateHigh
        expr: sum(rate(http_requests_total{status="500"}[30s])) / sum(rate(http_requests_total[30s])) > 0.2
        for: 60s
        labels: {severity: warning, service: api}
        annotations:
          summary: "More than 20% of orders API requests are failing."
