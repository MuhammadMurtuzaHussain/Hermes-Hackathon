# Night Shift demo environment.
#   cp .env.example .env && docker compose up -d --build
# Then trigger an incident from demo/chaos/.

services:
  postgres:
    image: postgres:16.4
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=40"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: ./app
    container_name: api
    labels:
      nightshift.release: ${RELEASE:-v1}
    environment:
      RELEASE: ${RELEASE:-v1}
      DATABASE_URL: postgresql://app:app@postgres:5432/postgres
    ports: ["127.0.0.1:${API_PORT:-18090}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  loadgen:
    image: curlimages/curl:8.10.1
    container_name: loadgen
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null http://api:8080/orders; sleep 0.5; done"]
    depends_on: [api]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ["127.0.0.1:9093:9093"]

  relay:
    image: python:3.12-slim
    container_name: nightshift-relay
    command: ["python", "/relay/relay.py"]
    volumes:
      - ./relay:/relay:ro
    environment:
      NIGHTSHIFT_WEBHOOK_SECRET: ${NIGHTSHIFT_WEBHOOK_SECRET:?set it in demo/.env}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-http://host.docker.internal:8644/webhooks/nightshift}
    extra_hosts: ["host.docker.internal:host-gateway"]
