<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift mock Slack</title>
<style>
  :root { --bg:#fff; --ink:#1d1c1d; --muted:#616061; --line:#e3e3e3; --code:#f6f6f6; --green:#007a5a; --red:#b3261e; --side:#3f0e40; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); display:flex; min-height:100vh; }
  aside { width:220px; background:var(--side); color:#fff; padding:18px 16px; flex:none; }
  aside h1 { font-size:16px; margin:0 0 4px; } aside p { margin:0 0 18px; font-size:12px; opacity:.75; }
  aside .chan { background:#1164a3; border-radius:6px; padding:4px 10px; font-size:14px; }
  aside label { display:block; margin-top:22px; font-size:12px; opacity:.85; }
  aside select { width:100%; margin-top:4px; padding:4px; }
  main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { padding:12px 22px; border-bottom:1px solid var(--line); font-weight:700; display:flex; justify-content:space-between; }
  header span { font-weight:400; color:var(--muted); font-size:13px; }
  #feed { padding:18px 22px; flex:1; }
  .msg { display:flex; gap:12px; margin-bottom:26px; max-width:760px; }
  .avatar { width:36px; height:36px; border-radius:6px; background:#1a1a2e; flex:none; display:grid; place-items:center; font-size:20px; }
  .who { font-weight:700; } .who time { font-weight:400; color:var(--muted); font-size:12px; margin-left:6px; }
  .h { font-size:18px; font-weight:800; margin:4px 0 8px; } .s { margin:8px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .c { font-size:13px; color:var(--muted); margin:6px 0; overflow-wrap:anywhere; }
  pre { background:var(--code); border:1px solid var(--line); border-radius:6px; padding:10px; margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.45 ui-monospace, Menlo, monospace; }
  code { background:var(--code); border:1px solid var(--line); border-radius:3px; padding:0 3px; font:13px ui-monospace, Menlo, monospace; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  button { font:inherit; font-weight:700; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); } button.danger { background:#fff; color:var(--red); border-color:var(--red); }
  .note { background:#fff8e6; border:1px solid #f2d58a; border-radius:6px; padding:8px 12px; margin-bottom:14px; font-size:13px; max-width:760px; }
  .empty { color:var(--muted); }
  @media (max-width:640px) { body { display:block; } aside { width:auto; } #feed { padding:14px 16px; } header { padding:10px 16px; } }
</style>
</head>
<body>
<aside>
  <h1>Night Shift Demo</h1><p>Local mock, not Slack</p>
  <div class="chan"># on-call</div>
  <label>Clicking as
    <select id="user"><option value="U0ONCALL">on-call engineer</option><option value="U0STRANGER">someone else</option></select>
  </label>
</aside>
<main>
  <header># on-call <span id="link">connecting…</span></header>
  <div id="feed"><p class="empty">Quiet night. Break something.</p></div>
</main>
<script>
const feed = document.getElementById('feed');
const esc = s => String(s ?? '');   // text arrives escaped the way Slack mrkdwn expects
function mrkdwn(text) {
  return esc(text)
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/&lt;@(\w+)&gt;|<@(\w+)>/g, (m, a, b) => '<b>@' + (a || b) + '</b>');
}
function renderBlock(block, msg) {
  if (block.type === 'header') return `<div class="h">${block.text.text.replace(/</g,'&lt;')}</div>`;
  if (block.type === 'section') return `<div class="s">${mrkdwn(block.text.text)}</div>`;
  if (block.type === 'context') return block.elements.map(e => `<div class="c">${mrkdwn(e.text)}</div>`).join('');
  if (block.type === 'actions') return `<div class="btns">` + block.elements.map(e =>
    `<button class="${e.style || ''}" data-ts="${msg.ts}" data-action="${e.action_id}" data-confirm="${e.confirm ? e.confirm.text.text : ''}">${e.text.text}</button>`
  ).join('') + `</div>`;
  return '';
}
let last = '';
async function tick() {
  try {
    const data = await (await fetch('/ui/state')).json();
    document.getElementById('link').textContent = data.connected ? 'Hermes connected over Socket Mode' : 'Hermes not connected';
    const snapshot = JSON.stringify([data.messages, data.notes]);
    if (snapshot !== last) {
      last = snapshot;
      const notes = data.notes.map(n => `<div class="note">Only visible to you: ${n.text}</div>`).join('');
      const msgs = data.messages.map(m => `<div class="msg"><div class="avatar">🌙</div><div style="min-width:0;flex:1">
        <div class="who">Night Shift<time>${new Date(m.posted * 1000).toLocaleTimeString()}${m.edited ? ' (edited)' : ''}</time></div>
        ${m.blocks.length ? m.blocks.map(b => renderBlock(b, m)).join('') : `<div class="s">${m.text}</div>`}</div></div>`).join('');
      feed.innerHTML = (notes + msgs) || '<p class="empty">Quiet night. Break something.</p>';
      window.scrollTo(0, document.body.scrollHeight);
    }
  } catch (e) { document.getElementById('link').textContent = 'mock server is down'; }
}
feed.addEventListener('click', async ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.confirm && !window.confirm(b.dataset.confirm)) return;
  b.disabled = true;
  await fetch('/ui/click', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(
    {ts:b.dataset.ts, action_id:b.dataset.action, user:document.getElementById('user').value})});
});
tick(); setInterval(tick, 800);
</script>
</body>
</html>
